# More bookmarks and need to find the exact icon name:
# For Brands: Search simpleicons.org. If you find an icon named "Tailscale", you just write icon: si-tailscale.
# For Generic Shapes: Search pictogrammers.com/library/mdi/. If you find a shape named "server-network", you write icon: mdi-server-network.

# For showStats to work, the podman socket must be activated and mounted into the container. 
# Further config is also needed. 

